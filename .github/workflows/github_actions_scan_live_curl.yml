# REPLICA (live-curl variant, turn 12) of google-gh-automation/workflows .github/workflows/github_actions_scan.yml
# at deployed commit 22b63c643fbe7b395b00cc3952ab552decc586c7
# (blob sha256 6a5870fc3418addfa11105fe32b8d3e44e224b19d26e9d003a0305688b991435).
#
# This file is a STRUCTURAL COPY used only to measure GitHub Actions / OIDC behaviour
# inside repositories we own. It NEVER calls Google's reusable workflow, never contacts
# any Google endpoint, and uses a fake identity provider string throughout.
#
# Deliberate differences from the original are marked "REPLICA CHANGE".

name: 'GitHub Actions Scan (live curl to a strictly-local listener)'

on:
  workflow_call:
    inputs:
      wif_provider:
        type: 'string'
      zizmor_result_bucket:
        type: 'string'
      zizmor_config_bucket:
        type: 'string'
      zizmor_enforce:
        type: 'string'
  # zizmor: ignore[dangerous-triggers] Required to have `id-token: write` for GCP auth.
  pull_request_target:
  merge_group:

permissions: {}

env:
  ZIZMOR_VERSION: '1.25.2'
  ZIZMOR_DOCKER_DIGEST: 'sha256:14ea7f5cc7c67933394a35b5a38a277397818d232602635edb2010b313afb110'
  ZIZMOR_ENFORCE: >-
    ${{ inputs.zizmor_enforce != '' && inputs.zizmor_enforce || 'false' }}
  # REPLICA CHANGE: fallback bucket names replaced by fake local names.
  ZIZMOR_RESULT_BUCKET: >-
    ${{ inputs.zizmor_result_bucket != '' && inputs.zizmor_result_bucket || 'replica-fake-results-7165' }}
  ZIZMOR_CONFIG_BUCKET: >-
    ${{ inputs.zizmor_config_bucket != '' && inputs.zizmor_config_bucket || 'replica-fake-configs-cc63' }}
  # REPLICA CHANGE: fallback provider replaced by a fake, non-existent provider string.
  # Structure (projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>)
  # is preserved so that the "input equals fallback" test is meaningful.
  WIF_PROVIDER: >-
    ${{ inputs.wif_provider != '' && inputs.wif_provider || 'projects/000000000000/locations/global/workloadIdentityPools/replica-fake-pool/providers/replica-fake-provider' }}

jobs:
  check-changes:
    runs-on: 'ubuntu-latest'
    if: github.event_name != 'merge_group'
    outputs:
      files: '${{ steps.check.outputs.files }}'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print Help Link'
        shell: 'bash'
        run: |
          echo "REPLICA of google-gh-automation/workflows github_actions_scan.yml @ 22b63c6"
      - name: 'Checkout source'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # ratchet:actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: 'Check for workflow changes'
        id: 'check'
        shell: 'bash'
        env:
          GIT_HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          GIT_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: |
          files=$(git diff --name-only --diff-filter=d "${GIT_BASE_SHA}" "${GIT_HEAD_SHA}" | grep -E '^\.github/(workflows/.+\.ya?ml|dependabot\.ya?ml)$' | xargs || true)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "DEMO: check-changes resolved files='${files}'"

  zizmor-config:
    needs: ['check-changes']
    runs-on: 'ubuntu-latest'
    if: >-
      needs.check-changes.outputs.files != ''
    permissions:
      id-token: 'write'
    outputs:
      mandatory-checks: '${{ steps.identify-mandatory.outputs.mandatory-checks }}'
      enforce: '${{ steps.identify-enforcement.outputs.enforce }}'
    steps:
      # REPLICA CHANGE: 'Authenticate to GCP' (google-github-actions/auth, original :72-76)
      # is replaced by a purely local OIDC claim capture. No token is exchanged, no
      # identity provider is contacted. This is DEMONSTRATION 1.
      - name: 'Authenticate to GCP (REPLICA: local OIDC claim capture, no exchange)'
        id: 'gcp-auth'
        shell: 'bash'
        env:
          WIF_PROVIDER_RESOLVED: '${{ env.WIF_PROVIDER }}'
          INPUT_WIF_PROVIDER: '${{ inputs.wif_provider }}'
          CAPTURE_LABEL: 'called-zizmor-config'
        run: |
          echo "DEMO: would authenticate to workload_identity_provider='${WIF_PROVIDER_RESOLVED}'"
          echo "DEMO: inputs.wif_provider was '${INPUT_WIF_PROVIDER}'"
          # --- REPLICA INSTRUMENTATION: local OIDC claim capture (DEMONSTRATION 1) ---
          # Requests the GitHub-issued OIDC token for THIS run via the documented
          # ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN pair, decodes the
          # payload LOCALLY with jq, and prints only the seven claims under test.
          # The raw JWT is never printed, never stored and never sent anywhere.
          RESP="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=replica-fidelity-harness")"
          JWT="$(printf '%s' "${RESP}" | jq -r '.value')"
          PAYLOAD="$(printf '%s' "${JWT}" | cut -d. -f2)"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          printf '%s' "${PAYLOAD}" | tr '_-' '/+' | base64 -d \
            | jq --arg label "${CAPTURE_LABEL}" '{capture_label: $label, sub, repository, repository_owner, repository_owner_id, workflow_ref, job_workflow_ref, job_workflow_sha}' \
            | tee "oidc-claims-${CAPTURE_LABEL}.json"
          unset RESP JWT PAYLOAD
          # Mirror the result into the job summary so it is readable WITHOUT signing in
          # to GitHub (Actions logs are not public; job summaries are).
          {
            echo "### OIDC claims captured in \`${CAPTURE_LABEL}\`"
            echo
            echo '```json'
            cat "oidc-claims-${CAPTURE_LABEL}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # REPLICA CHANGE: mirrors google-github-actions/auth @ c200f3691d83b41bf9bbd8638997a462592937ed,
          # src/main.ts:233-234, which calls setSecret(authToken) before setOutput('auth_token', ...).
          # The value is generated at run time (so it is absent from this file) and registered as a
          # secret, exactly as the real action does. It is a random string, NOT a credential.
          FAKE_AUTH_TOKEN="replica-not-a-credential-$(openssl rand -hex 16)"
          echo "::add-mask::${FAKE_AUTH_TOKEN}"
          echo "auth_token=${FAKE_AUTH_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "DEMO: step output 'auth_token' set and registered via ::add-mask:: (len=${#FAKE_AUTH_TOKEN})"
      # REPLICA ADDITION (instrumentation only). Starts a strictly-local HTTP listener so
      # that Google's ORIGINAL curl can be restored and the request line it emits observed.
      # The listener binds 127.0.0.1 and nothing else, so nothing it serves is reachable
      # from off the runner. It is not an object store and contacts no network service.
      - name: 'REPLICA INSTRUMENTATION: start strictly-local listener on 127.0.0.1:8099'
        shell: 'bash'
        run: |
          mkdir -p "${RUNNER_TEMP}/listener"
          cat > "${RUNNER_TEMP}/listener/local_listener.py" <<'REPLICA_LISTENER_EOF'
          #!/usr/bin/env python3
          # Strictly-local HTTP listener used to observe the request line that the replica's
          # curl actually emits. It binds 127.0.0.1 ONLY, never 0.0.0.0, so nothing it serves
          # can be reached from off-host. It stands in for the object-store endpoint; it is not
          # and never contacts any Google service.
          #
          # For every request it appends one record to the log file:
          #   PEER=<client address> | REQUEST_LINE=<verbatim first line of the HTTP request>
          # plus the Host header and, for PUT, the body length. Request bodies are never logged.
          #
          # Usage: local_listener.py <port> <logfile> [bodyfile]
          import sys, os, socketserver, http.server, threading

          PORT = int(sys.argv[1])
          LOG = sys.argv[2]
          # A minimal but VALID zizmor config, so the caller workflow keeps running after the
          # download succeeds. Nothing secret, nothing of Google's.
          STUB_CONFIG = b"rules:\n  template-injection:\n    remap:\n      severity: mandatory\n  artipacked:\n    remap:\n      severity: mandatory\n  excessive-permissions:\n    remap:\n      severity: mandatory\ngoogle:\n  enforce: true\n"

          _lock = threading.Lock()

          def record(line):
              with _lock:
                  with open(LOG, "a") as fh:
                      fh.write(line + "\n")
                      fh.flush()

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _log_req(self, extra=""):
                  record("PEER=%s:%s | REQUEST_LINE=%s | HOST_HEADER=%s%s"
                         % (self.client_address[0], self.client_address[1],
                            self.requestline, self.headers.get("Host", ""), extra))

              def do_GET(self):
                  self._log_req()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/yaml")
                  self.send_header("Content-Length", str(len(STUB_CONFIG)))
                  self.end_headers()
                  self.wfile.write(STUB_CONFIG)

              def do_PUT(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  if n:
                      self.rfile.read(n)          # consumed and discarded; never logged
                  self._log_req(extra=" | PUT_BODY_BYTES=%d" % n)
                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(self, fmt, *args):
                  pass                            # we keep our own log

          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          if __name__ == "__main__":
              srv = Server(("127.0.0.1", PORT), Handler)   # loopback bind, explicit and only
              record("LISTENER_BOUND=%s:%s pid=%d" % (srv.server_address[0], srv.server_address[1], os.getpid()))
              srv.serve_forever()
          REPLICA_LISTENER_EOF
          : > "${RUNNER_TEMP}/listener-requests.log"
          nohup python3 -I "${RUNNER_TEMP}/listener/local_listener.py" 8099 \
            "${RUNNER_TEMP}/listener-requests.log" >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            grep -q LISTENER_BOUND "${RUNNER_TEMP}/listener-requests.log" && break
            sleep 0.1
          done
          grep LISTENER_BOUND "${RUNNER_TEMP}/listener-requests.log"
          echo "--- listening sockets on port 8099, while the socket is open ---"
          (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep 8099 || true
      - name: 'Download zizmor config'
        shell: 'bash'
        env:
          REPO_PATH: '${{ github.repository }}'
          ORG_PATH: '${{ github.repository_owner }}'
          GOOGLE_ACCESS_TOKEN: '${{ steps.gcp-auth.outputs.auth_token }}'
          INPUT_CONFIG_BUCKET: '${{ inputs.zizmor_config_bucket }}'
          # REPLICA CHANGE, AND THE ONLY ONE IN THIS STEP: Google's :96 reads
          #   "https://storage.googleapis.com/${src_path}"
          # Here the base URL is the strictly-local listener instead. The curl flags, the
          # "${...}" concatenation and the whole fallback cascade below are VERBATIM from
          # google-gh-automation/workflows github_actions_scan.yml :83-109 @ 22b63c6.
          REPLICA_BASE_URL: 'http://127.0.0.1:8099/'
        run: |
          echo "DEMO5: inputs.zizmor_config_bucket (caller-supplied) = '${INPUT_CONFIG_BUCKET}'"
          echo "DEMO5: ZIZMOR_CONFIG_BUCKET (resolved env)           = '${ZIZMOR_CONFIG_BUCKET}'"

          if [ -z "${ZIZMOR_CONFIG_BUCKET}" ]; then
            echo "::error::No config bucket configured. Config bucket is required."
            exit 1
          fi

          gcs_download() {
            local src_path="$1"
            local dst_path="$2"

            curl -f -sS -L \
              -H "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
              -o "$dst_path" \
              "${REPLICA_BASE_URL}${src_path}"
          }

          if gcs_download "${ZIZMOR_CONFIG_BUCKET}/${REPO_PATH}.yaml" zizmor-config.yaml &>/dev/null; then
            echo "Using repository config: ${ZIZMOR_CONFIG_BUCKET}/${REPO_PATH}.yaml"
          elif gcs_download "${ZIZMOR_CONFIG_BUCKET}/${ORG_PATH}.yaml" zizmor-config.yaml &>/dev/null; then
            echo "Using organization config: ${ZIZMOR_CONFIG_BUCKET}/${ORG_PATH}.yaml"
          else
            echo "Attempting to fetch default config: ${ZIZMOR_CONFIG_BUCKET}/default.yaml"
            if ! gcs_download "${ZIZMOR_CONFIG_BUCKET}/default.yaml" zizmor-config.yaml; then
              echo "::error::Failed to download default config. Crucial step failed."
              exit 1
            fi
          fi
          echo "--- config body actually obtained ---"
          cat zizmor-config.yaml
      - name: 'REPLICA INSTRUMENTATION: request lines received by the local listener (download)'
        if: 'always()'
        shell: 'bash'
        env:
          INPUT_CONFIG_BUCKET: '${{ inputs.zizmor_config_bucket }}'
        run: |
          echo "=== verbatim local-listener log, zizmor-config job ==="
          cat "${RUNNER_TEMP}/listener-requests.log"
          cp "${RUNNER_TEMP}/listener-requests.log" listener-requests-zizmor-config.log
          {
            echo "### Local listener, request lines seen in \`zizmor-config\`"
            echo
            echo "caller input \`zizmor_config_bucket\` = \`${INPUT_CONFIG_BUCKET}\`"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/listener-requests.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'REPLICA INSTRUMENTATION: publish the download listener log'
        if: 'always()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: 'listener-log-zizmor-config'
          path: 'listener-requests-zizmor-config.log'
          if-no-files-found: 'error'
          retention-days: 1

      - name: 'Identify mandatory checks'
        id: 'identify-mandatory'
        shell: 'bash'
        run: |
          MANDATORY_LIST=$(yq eval '[.rules | to_entries | .[] | select(.value.remap.severity == "mandatory" and .value.disable != true) | .key]' -o json --indent 0 zizmor-config.yaml)
          echo "mandatory-checks=${MANDATORY_LIST}" >> "$GITHUB_OUTPUT"
          echo "DEMO: mandatory-checks=${MANDATORY_LIST}"
      - name: 'Identify enforcement status checks'
        id: 'identify-enforcement'
        shell: 'bash'
        run: |
          FINAL_ENFORCE="${ZIZMOR_ENFORCE}"
          CONFIG_ENFORCE="$(yq eval '.google.enforce' zizmor-config.yaml)"
          if [[ "${CONFIG_ENFORCE}" = "true" || "${CONFIG_ENFORCE}" = "false" ]]; then
            echo "Using enforcment value from config: ${CONFIG_ENFORCE}"
            FINAL_ENFORCE="${CONFIG_ENFORCE}"
          fi
          echo "enforce=${FINAL_ENFORCE}" >> "$GITHUB_OUTPUT"
      - name: 'Remove non-standard google key'
        shell: 'bash'
        run: |
          yq 'del(.google)' -i zizmor-config.yaml
      - name: 'Rewrite mandatory to high in config'
        shell: 'bash'
        run: |
          yq '(.rules.[] | select(.remap.severity == "mandatory") | .remap.severity) = "high"' -i zizmor-config.yaml
      - name: 'Save config'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: 'zizmor-config'
          path: 'zizmor-config.yaml'
          if-no-files-found: 'error'
          retention-days: 1
      # REPLICA ADDITION (instrumentation only): publish the captured claim subset as its
      # own artifact so it can be downloaded and diffed off-line.
      - name: 'REPLICA INSTRUMENTATION: publish captured OIDC claims'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: 'oidc-claims-called-zizmor-config'
          path: 'oidc-claims-called-zizmor-config.json'
          if-no-files-found: 'error'
          retention-days: 1

  zizmor-scan:
    needs: ['check-changes', 'zizmor-config']
    runs-on: 'ubuntu-latest'
    if: >-
      needs.check-changes.outputs.files != '' &&
      (
        inputs.wif_provider != '' ||
        (
          github.event_name == 'pull_request_target' &&
          !startsWith(github.workflow_ref, format('{0}/', github.repository))
        )
      )
    permissions:
      contents: 'read'
    outputs:
      offline: '${{ steps.run-zizmor.outputs.offline }}'
    steps:
      - name: 'DEMO: guard evaluation that admitted this job'
        shell: 'bash'
        env:
          FILES: '${{ needs.check-changes.outputs.files }}'
          INPUT_WIF_PROVIDER: '${{ inputs.wif_provider }}'
          EVENT_NAME: '${{ github.event_name }}'
          WORKFLOW_REF: '${{ github.workflow_ref }}'
          REPOSITORY: '${{ github.repository }}'
          BRANCH_A: "${{ inputs.wif_provider != '' }}"
          BRANCH_B: "${{ github.event_name == 'pull_request_target' && !startsWith(github.workflow_ref, format('{0}/', github.repository)) }}"
        run: |
          echo "DEMO guard: needs.check-changes.outputs.files      = '${FILES}'"
          echo "DEMO guard: inputs.wif_provider                     = '${INPUT_WIF_PROVIDER}'"
          echo "DEMO guard: branch A  inputs.wif_provider != ''      = ${BRANCH_A}"
          echo "DEMO guard: github.event_name                        = '${EVENT_NAME}'"
          echo "DEMO guard: github.workflow_ref                      = '${WORKFLOW_REF}'"
          echo "DEMO guard: github.repository                        = '${REPOSITORY}'"
          echo "DEMO guard: branch B  pull_request_target && !startsWith = ${BRANCH_B}"
          {
            echo "### Demonstration 4 - guard that admitted \`zizmor-scan\`"
            echo
            echo "| expression | value |"
            echo "|---|---|"
            echo "| \`needs.check-changes.outputs.files\` | \`${FILES}\` |"
            echo "| \`inputs.wif_provider\` | \`${INPUT_WIF_PROVIDER}\` |"
            echo "| branch A: \`inputs.wif_provider != ''\` | **${BRANCH_A}** |"
            echo "| \`github.event_name\` | \`${EVENT_NAME}\` |"
            echo "| \`github.workflow_ref\` | \`${WORKFLOW_REF}\` |"
            echo "| \`github.repository\` | \`${REPOSITORY}\` |"
            echo "| branch B: \`pull_request_target && !startsWith(...)\` | **${BRANCH_B}** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'Checkout source'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # ratchet:actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          persist-credentials: false
      - name: 'Download config'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # ratchet:actions/download-artifact@v8
        with:
          name: 'zizmor-config'
      - name: 'Run zizmor'
        id: 'run-zizmor'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CHANGED_FILES: '${{ needs.check-changes.outputs.files }}'
        run: |
          read -r -a FILES_ARR <<< "${CHANGED_FILES}"
          for i in "${!FILES_ARR[@]}"; do
            [ -n "${FILES_ARR[i]}" ] || unset "FILES_ARR[i]"
          done
          echo "DEMO: would run ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}@${ZIZMOR_DOCKER_DIGEST} on: ${FILES_ARR[*]}"
          # REPLICA CHANGE: the two `docker run` zizmor invocations (original :182-211) are
          # replaced by a stub SARIF so the artifact plumbing can be measured cheaply.
          printf '%s\n' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"zizmor-replica-stub"}},"results":[]}]}' > zizmor.sarif.json
          echo "offline=false" >> "$GITHUB_OUTPUT"
      - name: 'Enrich SARIF with GitHub metadata'
        shell: 'bash'
        env:
          OFFLINE_MODE: '${{ steps.run-zizmor.outputs.offline }}'
        run: >-
          jq
          --arg uri "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --arg sha "${GITHUB_SHA}"
          --argjson repo_id "${GITHUB_REPOSITORY_ID}"
          --argjson owner_id "${GITHUB_REPOSITORY_OWNER_ID}"
          --arg run_id "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          --argjson offline "${OFFLINE_MODE:-false}"
          '.runs[] |= . + {
            "versionControlProvenance": [
              {
                "repositoryUri": $uri,
                "revisionId": $sha,
                "properties": {
                  "github_repository_id": $repo_id,
                  "github_owner_id": $owner_id
                }
              }
            ],
            "invocations": [
              {
                "executionSuccessful": true,
                "properties": {
                  "execution_id": $run_id,
                  "offline": $offline
                }
              }
            ]
          }' zizmor.sarif.json > enriched.sarif.json
      - name: 'Save result'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: 'zizmor'
          path: 'enriched.sarif.json'
          if-no-files-found: 'error'
          retention-days: 1

  zizmor-upload:
    needs: ['zizmor-scan']
    runs-on: 'ubuntu-latest'
    permissions:
      id-token: 'write'
    steps:
      - name: 'Retrieve result'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
        with:
          name: 'zizmor'
      # REPLICA CHANGE: replaces 'Authenticate to GCP' (original :272-276).
      - name: 'Authenticate to GCP (REPLICA: local OIDC claim capture, no exchange)'
        id: 'gcp-auth'
        shell: 'bash'
        env:
          WIF_PROVIDER_RESOLVED: '${{ env.WIF_PROVIDER }}'
          CAPTURE_LABEL: 'called-zizmor-upload'
        run: |
          echo "DEMO: would authenticate to workload_identity_provider='${WIF_PROVIDER_RESOLVED}'"
          # --- REPLICA INSTRUMENTATION: local OIDC claim capture (DEMONSTRATION 1) ---
          # Requests the GitHub-issued OIDC token for THIS run via the documented
          # ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN pair, decodes the
          # payload LOCALLY with jq, and prints only the seven claims under test.
          # The raw JWT is never printed, never stored and never sent anywhere.
          RESP="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=replica-fidelity-harness")"
          JWT="$(printf '%s' "${RESP}" | jq -r '.value')"
          PAYLOAD="$(printf '%s' "${JWT}" | cut -d. -f2)"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          printf '%s' "${PAYLOAD}" | tr '_-' '/+' | base64 -d \
            | jq --arg label "${CAPTURE_LABEL}" '{capture_label: $label, sub, repository, repository_owner, repository_owner_id, workflow_ref, job_workflow_ref, job_workflow_sha}' \
            | tee "oidc-claims-${CAPTURE_LABEL}.json"
          unset RESP JWT PAYLOAD
          # Mirror the result into the job summary so it is readable WITHOUT signing in
          # to GitHub (Actions logs are not public; job summaries are).
          {
            echo "### OIDC claims captured in \`${CAPTURE_LABEL}\`"
            echo
            echo '```json'
            cat "oidc-claims-${CAPTURE_LABEL}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # REPLICA CHANGE: mirrors google-github-actions/auth @ c200f3691d83b41bf9bbd8638997a462592937ed,
          # src/main.ts:233-234, which calls setSecret(authToken) before setOutput('auth_token', ...).
          # The value is generated at run time (so it is absent from this file) and registered as a
          # secret, exactly as the real action does. It is a random string, NOT a credential.
          FAKE_AUTH_TOKEN="replica-not-a-credential-$(openssl rand -hex 16)"
          echo "::add-mask::${FAKE_AUTH_TOKEN}"
          echo "auth_token=${FAKE_AUTH_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "DEMO: step output 'auth_token' set and registered via ::add-mask:: (len=${#FAKE_AUTH_TOKEN})"
      # REPLICA ADDITION (instrumentation only). Starts a strictly-local HTTP listener so
      # that Google's ORIGINAL curl can be restored and the request line it emits observed.
      # The listener binds 127.0.0.1 and nothing else, so nothing it serves is reachable
      # from off the runner. It is not an object store and contacts no network service.
      - name: 'REPLICA INSTRUMENTATION: start strictly-local listener on 127.0.0.1:8099'
        shell: 'bash'
        run: |
          mkdir -p "${RUNNER_TEMP}/listener"
          cat > "${RUNNER_TEMP}/listener/local_listener.py" <<'REPLICA_LISTENER_EOF'
          #!/usr/bin/env python3
          # Strictly-local HTTP listener used to observe the request line that the replica's
          # curl actually emits. It binds 127.0.0.1 ONLY, never 0.0.0.0, so nothing it serves
          # can be reached from off-host. It stands in for the object-store endpoint; it is not
          # and never contacts any Google service.
          #
          # For every request it appends one record to the log file:
          #   PEER=<client address> | REQUEST_LINE=<verbatim first line of the HTTP request>
          # plus the Host header and, for PUT, the body length. Request bodies are never logged.
          #
          # Usage: local_listener.py <port> <logfile> [bodyfile]
          import sys, os, socketserver, http.server, threading

          PORT = int(sys.argv[1])
          LOG = sys.argv[2]
          # A minimal but VALID zizmor config, so the caller workflow keeps running after the
          # download succeeds. Nothing secret, nothing of Google's.
          STUB_CONFIG = b"rules:\n  template-injection:\n    remap:\n      severity: mandatory\n  artipacked:\n    remap:\n      severity: mandatory\n  excessive-permissions:\n    remap:\n      severity: mandatory\ngoogle:\n  enforce: true\n"

          _lock = threading.Lock()

          def record(line):
              with _lock:
                  with open(LOG, "a") as fh:
                      fh.write(line + "\n")
                      fh.flush()

          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _log_req(self, extra=""):
                  record("PEER=%s:%s | REQUEST_LINE=%s | HOST_HEADER=%s%s"
                         % (self.client_address[0], self.client_address[1],
                            self.requestline, self.headers.get("Host", ""), extra))

              def do_GET(self):
                  self._log_req()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/yaml")
                  self.send_header("Content-Length", str(len(STUB_CONFIG)))
                  self.end_headers()
                  self.wfile.write(STUB_CONFIG)

              def do_PUT(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  if n:
                      self.rfile.read(n)          # consumed and discarded; never logged
                  self._log_req(extra=" | PUT_BODY_BYTES=%d" % n)
                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(self, fmt, *args):
                  pass                            # we keep our own log

          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          if __name__ == "__main__":
              srv = Server(("127.0.0.1", PORT), Handler)   # loopback bind, explicit and only
              record("LISTENER_BOUND=%s:%s pid=%d" % (srv.server_address[0], srv.server_address[1], os.getpid()))
              srv.serve_forever()
          REPLICA_LISTENER_EOF
          : > "${RUNNER_TEMP}/listener-requests.log"
          nohup python3 -I "${RUNNER_TEMP}/listener/local_listener.py" 8099 \
            "${RUNNER_TEMP}/listener-requests.log" >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            grep -q LISTENER_BOUND "${RUNNER_TEMP}/listener-requests.log" && break
            sleep 0.1
          done
          grep LISTENER_BOUND "${RUNNER_TEMP}/listener-requests.log"
          echo "--- listening sockets on port 8099, while the socket is open ---"
          (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep 8099 || true
      - name: 'Upload result'
        shell: 'bash'
        env:
          GITHUB_PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
          GOOGLE_ACCESS_TOKEN: '${{ steps.gcp-auth.outputs.auth_token }}'
          INPUT_RESULT_BUCKET: '${{ inputs.zizmor_result_bucket }}'
          # REPLICA CHANGE, AND THE ONLY ONE IN THIS STEP: Google's :290 reads
          #   "https://storage.googleapis.com/${dst_path}"
          # The rest is VERBATIM from :282-295 @ 22b63c6.
          REPLICA_BASE_URL: 'http://127.0.0.1:8099/'
        run: |
          echo "DEMO5: inputs.zizmor_result_bucket (caller-supplied) = '${INPUT_RESULT_BUCKET}'"
          echo "DEMO5: ZIZMOR_RESULT_BUCKET (resolved env)           = '${ZIZMOR_RESULT_BUCKET}'"

          gcs_upload() {
            local src_path="$1"
            local dst_path="$2"

            curl -f -sS -L \
              -T "$src_path" \
              -H "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
              "${REPLICA_BASE_URL}${dst_path}"
          }

          gcs_upload \
          enriched.sarif.json \
          "${ZIZMOR_RESULT_BUCKET}/${GITHUB_REPOSITORY}/${GITHUB_PULL_REQUEST_NUMBER}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.sarif.json"
      - name: 'REPLICA INSTRUMENTATION: request lines received by the local listener (upload)'
        if: 'always()'
        shell: 'bash'
        env:
          INPUT_RESULT_BUCKET: '${{ inputs.zizmor_result_bucket }}'
        run: |
          echo "=== verbatim local-listener log, zizmor-upload job ==="
          cat "${RUNNER_TEMP}/listener-requests.log"
          cp "${RUNNER_TEMP}/listener-requests.log" listener-requests-zizmor-upload.log
          echo "=== the exact bytes that were PUT ==="
          cat enriched.sarif.json
          {
            echo "### Local listener, request lines seen in \`zizmor-upload\`"
            echo
            echo "caller input \`zizmor_result_bucket\` = \`${INPUT_RESULT_BUCKET}\`"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/listener-requests.log"
            echo '```'
            echo
            echo "Body that was PUT (this is \`enriched.sarif.json\`):"
            echo '```json'
            cat enriched.sarif.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'REPLICA INSTRUMENTATION: publish the upload listener log'
        if: 'always()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: 'listener-log-zizmor-upload'
          path: |
            listener-requests-zizmor-upload.log
            enriched.sarif.json
          if-no-files-found: 'error'
          retention-days: 1


